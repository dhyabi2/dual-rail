[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-rail"
version = "1.3.0"
description = "Add XNO beside USDC/x402, never instead of it: one appended accepts[] entry, and a verifier that proves both rails still work."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["x402", "nano", "xno", "payments", "wsgi", "middleware", "agent"]

[project.urls]
Homepage = "https://github.com/dhyabi2/dual-rail"
Source = "https://github.com/dhyabi2/dual-rail"

[project.scripts]
dual-rail = "dual_rail.cli:main"

[tool.setuptools]
packages = ["dual_rail"]
